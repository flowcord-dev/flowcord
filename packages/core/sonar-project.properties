sonar.organization=flowcord-dev
sonar.projectKey=flowcord-dev_flowcord-core

sonar.sources=src
sonar.exclusions=src/**/__tests__/**,src/mocks/**

sonar.tests=src
sonar.test.inclusions=src/**/__tests__/**/*.test.ts

sonar.coverage.exclusions=src/**/__tests__/**,src/mocks/**
sonar.cpd.exclusions=src/**/__tests__/**,src/mocks/**

# Merge core's own unit-test coverage with the integration suite's coverage of
# core (paths in the integration lcov are `../core/src/...`, resolving here).
sonar.javascript.lcov.reportPaths=coverage/lcov.info,../core-integration/coverage/lcov.info
