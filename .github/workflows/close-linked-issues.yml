name: Close Linked Issues

# GitHub's native closing-keyword links ("Closes #N") only fire for PRs that merge
# into the DEFAULT branch. PRs into epic/** integration branches don't get that
# behavior, so this workflow replicates it: on merge, parse the closing keywords
# from the PR body (same regex as pr-gate.yml) and close the referenced issues.

on:
  pull_request:
    types: [closed]
    branches:
      - 'epic/**'

jobs:
  close-linked-issues:
    name: Close issues linked from merged PR
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Close issues referenced with closing keywords
        uses: actions/github-script@v7
        with:
          script: |
            const pull = context.payload.pull_request;
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            const body = pull.body || '';
            const keyword = /\b(?:close|closes|closed|fix|fixes|fixed|resolve|resolves|resolved)\b\s*:?\s+#(\d+)/gi;
            const numbers = [...new Set([...body.matchAll(keyword)].map((match) => Number(match[1])))];

            if (numbers.length === 0) {
              core.info('No closing keywords found in the PR body — nothing to close.');
              return;
            }

            for (const number of numbers) {
              try {
                const { data: ref } = await github.rest.issues.get({ owner, repo, issue_number: number });
                if (ref.pull_request) {
                  core.info(`#${number} is a pull request — skipping.`);
                  continue;
                }
                if (ref.state === 'closed') {
                  core.info(`Issue #${number} is already closed — skipping.`);
                  continue;
                }

                await github.rest.issues.update({
                  owner, repo, issue_number: number,
                  state: 'closed', state_reason: 'completed',
                });
                await github.rest.issues.createComment({
                  owner, repo, issue_number: number,
                  body: `Closed automatically by ${pull.html_url} (merged into \`${pull.base.ref}\`). ` +
                    `GitHub's native closing-links only apply to PRs targeting the default branch.`,
                });
                core.info(`Closed issue #${number}.`);
              } catch (err) {
                const message = err instanceof Error ? err.message : String(err);
                core.warning(`Could not close referenced issue #${number}: ${message}`);
              }
            }
