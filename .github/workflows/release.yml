name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Build, Test & Publish
    runs-on: ubuntu-latest
    permissions:
      contents: write # needed to create GitHub Releases
      id-token: write # needed for npm OIDC Trusted Publishing + provenance

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # needed to check branch ancestry

      - name: Verify tag is on master
        run: |
          git fetch origin master
          if ! git merge-base --is-ancestor ${{ github.sha }} origin/master; then
            echo "Tag does not point to a commit on master. Aborting release."
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - name: Upgrade npm for OIDC Trusted Publishing
        # OIDC Trusted Publishing requires npm >= 11.5.1; Node 20/22 ship npm 10.x,
        # which silently skips the OIDC token exchange and fails publish with E404
        # (while still signing provenance). See CONTRIBUTING / release docs.
        run: |
          npm install -g npm@latest
          npm -v

      - name: Install dependencies
        run: npm ci

      - name: Typecheck & Lint
        run: npx nx run-many -t typecheck lint

      - name: Test
        run: npx nx test core --coverage

      - name: Build
        run: npx nx build core

      - name: Determine npm dist-tag
        id: dist_tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ "$VERSION" == *"-alpha"* ]] || [[ "$VERSION" == *"-beta"* ]] || [[ "$VERSION" == *"-rc"* ]]; then
            echo "tag=next" >> $GITHUB_OUTPUT
            echo "prerelease=true" >> $GITHUB_OUTPUT
          else
            echo "tag=latest" >> $GITHUB_OUTPUT
            echo "prerelease=false" >> $GITHUB_OUTPUT
          fi

      - name: Publish to npm
        run: npx nx release publish --tag ${{ steps.dist_tag.outputs.tag }}
        env:
          NPM_CONFIG_PROVENANCE: 'true' # publish with provenance via OIDC

      - name: Extract changelog notes
        id: changelog
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          NOTES=$(awk "/^## \[$VERSION\]/{found=1; next} /^## \[/{if(found) exit} found{print}" packages/core/CHANGELOG.md)
          echo "notes<<EOF" >> $GITHUB_OUTPUT
          echo "$NOTES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ steps.dist_tag.outputs.prerelease == 'true' }}
          body: ${{ steps.changelog.outputs.notes }}
