name: PR Gate

on:
  pull_request:
    types: [opened, reopened, edited]
    branches: [master, develop, 'epic/**']

jobs:
  check-linked-issue:
    name: Require approved linked issue
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      issues: read
    steps:
      - name: Check for approved linked issue
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.payload.pull_request.number;
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            const APPROVED_LABELS = ['feature: accepted', 'bug: confirmed', 'release'];

            const close = async (message) => {
              await github.rest.issues.createComment({
                owner, repo, issue_number: prNumber, body: message,
              });
              await github.rest.pulls.update({
                owner, repo, pull_number: prNumber, state: 'closed',
              });
              core.setFailed('PR closed: ' + message.split('\n')[0]);
            };

            // Primary: GitHub's own closing-issue parser via GraphQL — handles all keyword
            // variants (close/closes/closed, fix/fixes/fixed, resolve/resolves/resolved).
            // Note: linking an issue via the sidebar "Development" section does NOT count;
            // the keyword must appear in the PR description text.
            const result = await github.graphql(`
              query($owner: String!, $repo: String!, $number: Int!) {
                repository(owner: $owner, name: $repo) {
                  pullRequest(number: $number) {
                    closingIssuesReferences(first: 10) {
                      nodes {
                        number
                        labels(first: 20) {
                          nodes { name }
                        }
                      }
                    }
                  }
                }
              }
            `, { owner, repo, number: prNumber });

            let closingIssues = result.repository.pullRequest.closingIssuesReferences.nodes
              .map((node) => ({ number: node.number, labels: node.labels.nodes.map((lbl) => lbl.name) }));

            // Fallback: GitHub only populates closingIssuesReferences for PRs targeting the
            // repository's DEFAULT branch. For PRs into other bases (e.g. epic/** integration
            // branches), parse the closing keywords from the PR body and fetch labels directly.
            if (closingIssues.length === 0) {
              const body = context.payload.pull_request.body || '';
              const keyword = /\b(?:close|closes|closed|fix|fixes|fixed|resolve|resolves|resolved)\b\s*:?\s+#(\d+)/gi;
              const numbers = [...new Set([...body.matchAll(keyword)].map((match) => Number(match[1])))];
              for (const number of numbers) {
                try {
                  const { data: ref } = await github.rest.issues.get({ owner, repo, issue_number: number });
                  if (ref.pull_request) continue; // a PR, not an issue
                  closingIssues.push({ number, labels: ref.labels.map((lbl) => (typeof lbl === 'string' ? lbl : lbl.name)) });
                } catch (err) {
                  const message = err instanceof Error ? err.message : String(err);
                  core.warning(`Could not fetch referenced issue #${number}: ${message}`);
                }
              }
            }

            if (closingIssues.length === 0) {
              await close(
                `👋 Thanks for the PR! It's been automatically closed because no linked issue was found.\n\n` +
                `Every PR needs to reference an approved issue using a closing keyword in the PR description text:\n` +
                `\`\`\`\nCloses #123\n\`\`\`\n` +
                `- Bug fixes → an issue labeled \`bug: confirmed\`\n` +
                `- Features → an issue labeled \`feature: accepted\`\n\n` +
                `> **Note:** Linking an issue via the GitHub sidebar ("Development" section) is not sufficient — ` +
                `the \`Closes #N\` keyword must appear in the PR description text.\n\n` +
                `See [CONTRIBUTING.md](../blob/master/CONTRIBUTING.md) for the full process.`
              );
              return;
            }

            const approved = closingIssues.some(
              (issue) => APPROVED_LABELS.some((label) => issue.labels.includes(label))
            );

            if (!approved) {
              await close(
                `👋 Thanks for the PR! It's been automatically closed because the linked issue hasn't been approved yet.\n\n` +
                `The referenced issue needs one of these labels before a PR can be opened:\n` +
                `- \`bug: confirmed\` — for confirmed bugs\n` +
                `- \`feature: accepted\` — for approved feature requests\n\n` +
                `If the issue is still in discussion, please wait for a maintainer to apply the label. ` +
                `Feel free to reopen this PR once that's done. ` +
                `See [CONTRIBUTING.md](../blob/master/CONTRIBUTING.md) for the full process.`
              );
              return;
            }

            await github.rest.issues.createComment({
              owner, repo, issue_number: prNumber,
              body: `✅ Linked issue check passed — this PR references an approved issue.`,
            });
